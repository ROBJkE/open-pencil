[package]
name = "open_pencil"
version = "0.15.1"
description = "OpenPencil desktop app"
authors = ["Danila Poyarkov"]
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "OpenPencil"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
iced = { version = "0.14", features = ["image", "tokio"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync"] }
